name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy → tetapi.dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/tetapi_ed25519
          chmod 600 ~/.ssh/tetapi_ed25519
          ssh-keyscan -H 164.90.235.66 >> ~/.ssh/known_hosts

      - name: Sync landing page
        run: |
          ssh -i ~/.ssh/tetapi_ed25519 root@164.90.235.66 \
            "mkdir -p /var/www/teta-pi"
          # --chown=root:root: without it, `-a` implies -o -g and, running as
          # root on the receiver, rsync preserves the runner's numeric uid/gid
          # (user `runner` = 1001). uid 1001 on the droplet is co-tenant
          # `hellfire`, so every landing deploy chowned /var/www/teta-pi to
          # hellfire:hellfire — the tree nginx serves as tetapi.dev, i.e. a
          # co-tenant could deface the site (S-35; same trap as S-19, fixed in
          # api by 5.11 and web/mcp by 5.24). rsync >=3.1.0 on both ends.
          rsync -az --chown=root:root -e "ssh -i ~/.ssh/tetapi_ed25519" \
            --delete --exclude='.git' \
            ./ root@164.90.235.66:/var/www/teta-pi/
